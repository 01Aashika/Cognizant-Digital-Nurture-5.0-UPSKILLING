<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery for Community Events</title>

    <style>
        .event-image {
            border: 3px solid black;
            width: 200px;
            height: 150px;
        }

        table {
            border-collapse: collapse;
            margin: 20px auto;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <table border="1">
        <caption>Community Event Gallery</caption>

        <tr>
            <td>
                <img src="event1.jpg" alt="Sports Event"
                     title="Sports Event"
                     class="event-image">
                <p>Sports Day</p>
            </td>

            <td>
                <img src="event2.jpg" alt="Cultural Event"
                     title="Cultural Event"
                     class="event-image">
                <p>Cultural Festival</p>
            </td>

            <td>
                <img src="event3.jpg" alt="Music Event"
                     title="Music Event"
                     class="event-image">
                <p>Music Concert</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="event4.jpg" alt="Food Festival"
                     title="Food Festival"
                     class="event-image">
                <p>Food Festival</p>
            </td>

            <td>
                <img src="event5.jpg" alt="Awareness Program"
                     title="Awareness Program"
                     class="event-image">
                <p>Awareness Program</p>
            </td>

            <td>
                <img src="event6.jpg" alt="Community Meeting"
                     title="Community Meeting"
                     class="event-image">
                <p>Community Meeting</p>
            </td>
        </tr>

    </table>

</body>

</html>
