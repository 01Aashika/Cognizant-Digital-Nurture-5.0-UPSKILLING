<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise 8</title>

<link rel="stylesheet"
href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary">
Bootstrap Forms
</h1>

<hr>

<h4>Exercise 8.1</h4>

<p>
Registration Form using form-control, form-check and input-group
</p>

<form>

<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter your name">

</div>

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input
type="email"
class="form-control"
placeholder="Enter your email">

</div>

<div class="input-group mb-3">

<span class="input-group-text">
@
</span>

<input
type="text"
class="form-control"
placeholder="Username">

</div>

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox"
id="agree">

<label
class="form-check-label"
for="agree">

I agree to the terms and conditions

</label>

</div>

<button
type="submit"
class="btn btn-primary">

Register

</button>

</form>

<hr>

<h4>Exercise 8.2</h4>

<p>
Login Form using form-floating
</p>

<form>

<div class="form-floating mb-3">

<input
type="email"
class="form-control"
id="email"
placeholder="name@example.com">

<label for="email">
Email Address
</label>

</div>

<div class="form-floating mb-3">

<input
type="password"
class="form-control"
id="password"
placeholder="Password">

<label for="password">
Password
</label>

</div>

<button
type="submit"
class="btn btn-success">

Login

</button>

</form>

</div>

<script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
