<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise 9</title>

<link rel="stylesheet"
href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary">
Bootstrap Buttons
</h1>

<hr>

<h4>Exercise 9.1</h4>

<p>
Buttons using contextual and outline classes
</p>

<button class="btn btn-primary">
Primary
</button>

<button class="btn btn-secondary">
Secondary
</button>

<button class="btn btn-success">
Success
</button>

<button class="btn btn-danger">
Danger
</button>

<button class="btn btn-warning">
Warning
</button>

<button class="btn btn-info">
Info
</button>

<button class="btn btn-dark">
Dark
</button>

<br><br>

<button class="btn btn-outline-primary">
Outline Primary
</button>

<button class="btn btn-outline-success">
Outline Success
</button>

<button class="btn btn-outline-danger">
Outline Danger
</button>

<hr>

<h4>Exercise 9.2</h4>

<p>
Button Group using btn-group
</p>

<div class="btn-group">

<button class="btn btn-primary">
Home
</button>

<button class="btn btn-success">
Events
</button>

<button class="btn btn-danger">
Contact
</button>

</div>

<hr>

<p>
Toggle Buttons using Checkboxes
</p>

<input type="checkbox"
class="btn-check"
id="btncheck1">

<label
class="btn btn-outline-primary"
for="btncheck1">

Sports

</label>

<input type="checkbox"
class="btn-check"
id="btncheck2">

<label
class="btn btn-outline-success"
for="btncheck2">

Music

</label>

<input type="checkbox"
class="btn-check"
id="btncheck3">

<label
class="btn btn-outline-danger"
for="btncheck3">

Culture

</label>

</div>

<script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
