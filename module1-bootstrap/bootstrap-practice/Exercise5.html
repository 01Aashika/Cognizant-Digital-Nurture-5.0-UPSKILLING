href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">

<body>

<div class="container mt-5">

<h1 class="text-center text-primary">
Alignment and Reordering in Grid
</h1>

<hr>

<h4>Exercise 5.1</h4>

<p>
Using justify-content-center and align-items-center
</p>

<div class="row justify-content-center align-items-center bg-light"
style="height:200px;">

<div class="col-4">

<div class="bg-primary text-white p-4 text-center rounded">

Centered Content

</div>

</div>

</div>

<hr>

<h4>Exercise 5.2</h4>

<p>
Reordering columns using order-md classes
</p>

<div class="row">

<div class="col-md-6 order-md-2">

<div class="bg-success text-white p-4 text-center rounded">

Second On Desktop

</div>

</div>

<div class="col-md-6 order-md-1">

<div class="bg-danger text-white p-4 text-center rounded">

First On Desktop

</div>

</div>

</div>

</div>

<script src="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
